<div style="margin-top: 10px; margin-bottom: 17px;">
    <table class="table table-striped">
        <caption class="caption-top text-danger">
            <h3>Listado de productos</h3>
        </caption>
        <br>
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th class="text-success">Elegir</th>
                <th class="text-danger">Borrar</th>
            </tr>
        </thead>
        <tbody>
            @for (item of productos; track $index) {
            <tr>
                <td>{{item.id}}</td>
                <td>{{item.nombre}}</td>
                <td>{{item.descripcion}}</td>
                <td>{{item.precio}}</td>
                <td>{{item.categoria}}</td>

                <th style="width: 10px;">
                    <button class="btn btn-outline-success btn-sm ms-2" (click)="seleccionar(item)">
                        <i class="bi bi-check2-circle"></i>
                    </button>
                </th>

                <th style="width: 10px;">
                    <button class="btn btn-outline-danger btn-sm ms-2" (click)="borrarPorListado(item.id)">
                        <i class="bi bi-trash"></i>
                    </button>
                </th>

            </tr>
            }
        </tbody>
    </table>

    <!-- Botón formulario -->
    @if(!mostrarFormulario) {
    <button class="btn btn-success mt-3" (click)="verformulario()">Añadir producto</button>
    }@else {
    <button class="btn btn-danger mt-3" (click)="verformulario()">Cancelar</button>
    <div class="row m-3"></div>
    <hr>
    <h3>INSERTAR PRODUCTO</h3>
    <!-- Formulario -->
    <form>
        <!-- Campos -->
        <div class="my-3">
            <label for="id" class="form-label">ID</label>
            <input type="number" class="form-control" name="id" [(ngModel)]="producto.id" disabled>
        </div>
        <div class="my-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" [(ngModel)]="producto.nombre">
        </div>
        <div class="my-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <input type="text" class="form-control" name="descripcion" [(ngModel)]="producto.descripcion">
        </div>
        <div class="my-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" class="form-control" name="precio" [(ngModel)]="producto.precio">
        </div>
        <div class="my-3">
            <label for="categoria" class="form-label">Categoría</label>
            <select class="form-select form-select-sm" name="Categoría" [(ngModel)]="producto.categoria">
                @for (item of categorias; track $index) {
                <option value="{{item}}">{{item}}</option>
                }
            </select>
        </div>
        <div class="my-3">
            <label for="categoria" class="form-label">Categoría</label>
            <input type="text" class="form-control" name="categoria" [(ngModel)]="producto.categoria">
        </div>
        <!-- Enviar -->
        <hr>
        <button class="btn btn-success bi bi-plus-circle" (click)="insertarFormulario2()">&nbsp;Confirmar</button>
        &nbsp;
        <button class="btn btn-danger bi bi-x-circle" (click)="verformulario()">&nbsp;Cancelar&nbsp;&nbsp;</button>
    </form>
    }
</div>
